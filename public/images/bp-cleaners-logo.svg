<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">B&amp;P Cleaners logo</title>
  <desc id="desc">Professional logo for Benny and Penny Cleaning Services, serving residential and commercial clients.</desc>

  <defs>
    <linearGradient id="markBg" x1="54" y1="44" x2="436" y2="456" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1F6662"/>
      <stop offset="1" stop-color="#183437"/>
    </linearGradient>
    <linearGradient id="gold" x1="110" y1="78" x2="374" y2="371" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E4C078"/>
      <stop offset="0.52" stop-color="#B98B3D"/>
      <stop offset="1" stop-color="#8D6225"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#183437" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Brand mark -->
  <g filter="url(#softShadow)">
    <rect x="46" y="42" width="412" height="416" rx="94" fill="url(#markBg)"/>
    <rect x="58" y="54" width="388" height="392" rx="82" fill="none" stroke="#D8B66D" stroke-width="3" opacity="0.72"/>
  </g>

  <!-- Residential roof and commercial skyline -->
  <path d="M116 212L240 112L318 175" fill="none" stroke="url(#gold)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M151 201V325C151 346 168 363 189 363H277" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
  <path d="M238 363V226H301V363" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linejoin="round"/>
  <path d="M301 363V179H365V363" fill="none" stroke="#D8B66D" stroke-width="16" stroke-linejoin="round"/>
  <path d="M126 363H384" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>

  <!-- Windows -->
  <g fill="#D8B66D">
    <rect x="259" y="254" width="22" height="22" rx="4"/>
    <rect x="259" y="298" width="22" height="22" rx="4"/>
  </g>
  <g fill="#FFFFFF">
    <rect x="322" y="214" width="22" height="22" rx="4"/>
    <rect x="322" y="258" width="22" height="22" rx="4"/>
    <rect x="322" y="302" width="22" height="22" rx="4"/>
  </g>

  <!-- Cleaning sparkles -->
  <g fill="#FFFFFF">
    <path d="M379 98C379 121 388 130 411 130C388 130 379 139 379 162C379 139 370 130 347 130C370 130 379 121 379 98Z"/>
    <path d="M115 100C115 113 120 118 133 118C120 118 115 123 115 136C115 123 110 118 97 118C110 118 115 113 115 100Z" opacity="0.92"/>
    <circle cx="405" cy="184" r="8" fill="#D8B66D"/>
  </g>

  <!-- Wordmark -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="535" y="210" font-size="156" font-weight="800" letter-spacing="-8" fill="#183437">B<tspan fill="#B98B3D">&amp;</tspan>P</text>
    <text x="902" y="207" font-size="86" font-weight="700" letter-spacing="12" fill="#2F7D79">CLEANERS</text>

    <rect x="539" y="247" width="930" height="4" rx="2" fill="#D8B66D"/>

    <text x="539" y="317" font-size="42" font-weight="700" letter-spacing="2.2" fill="#183437">BENNY &amp; PENNY CLEANING SERVICES</text>

    <g transform="translate(539 350)">
      <rect width="678" height="74" rx="37" fill="#183437"/>
      <circle cx="37" cy="37" r="7" fill="#D8B66D"/>
      <text x="67" y="49" font-size="31" font-weight="700" letter-spacing="4.5" fill="#FFFFFF">RESIDENTIAL</text>
      <path d="M344 23V51" stroke="#D8B66D" stroke-width="3" stroke-linecap="round"/>
      <text x="374" y="49" font-size="31" font-weight="700" letter-spacing="4.5" fill="#FFFFFF">COMMERCIAL</text>
      <circle cx="641" cy="37" r="7" fill="#D8B66D"/>
    </g>
  </g>
</svg>
